<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Saodimallsu">
  <!--
    Brand mark: accent square + a white "S".

    Why a stroked path instead of <text>: a favicon renders in its own document
    with no access to the page's webfonts. <text font-family="Georgia"> falls
    back to whatever the OS picks, so the letter changes shape per platform —
    and at 16px in a tab, that letter *is* the icon.

    Why this path is symmetric: it is two mirrored bowls sharing the point
    (16,16). The control points are exact mirrors, so the stroke has the same
    weight and curvature at the top and the bottom, which is what stops it from
    looking crooked when the browser downsamples it to 16px.

    Geometry (32×32): bowls turn at y≈6.5 and y≈25.5, stems at x=11 and x=21,
    stroke 3 with round caps → drawn bounds x 9.5–22.5, y 5–27, i.e. centred
    with equal margins on all four sides.
  -->
  <rect width="32" height="32" rx="9" fill="#C8855A"/>
  <path
    d="M21 11C21 8 18.8 6.5 16 6.5C13.2 6.5 11 8.2 11 11C11 13.8 13.2 15.2 16 16C18.8 16.8 21 18.2 21 21C21 23.8 18.8 25.5 16 25.5C13.2 25.5 11 24 11 21"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
